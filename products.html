<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كل المنتجات | اونمي</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-row">
    <a href="index.html" class="brand"><span class="brand-mark">او</span>اونمي</a>
    <nav class="main-nav">
      <a href="index.html">الرئيسية</a>
      <a href="products.html">المنتجات</a>
      <a href="index.html#about">من نحن</a>
      <a href="index.html#contact">تواصل معنا</a>
    </nav>
    <div class="header-actions">
      <form class="search-box" data-header-search>
        <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="m18 18-3.8-3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="text" placeholder="ابحث عن منتج...">
      </form>
      <a href="cart.html" class="cart-link">سلة التسوق <span class="cart-count" data-cart-count>0</span></a>
    </div>
  </div>
</header>

<section class="section container">
  <div class="section-head">
    <div>
      <h2 id="page-title">كل المنتجات</h2>
      <p>تصفح مجموعتنا الكاملة من الأجهزة الإلكترونية.</p>
    </div>
  </div>

  <div class="filters-bar" id="chips"></div>
  <p class="results-count" id="results-count"></p>
  <div class="product-grid" id="grid"></div>
  <p id="empty-msg" style="display:none; text-align:center; padding:40px; color:var(--ink-soft);">
    لا توجد منتجات مطابقة لبحثك. جرّب كلمة أخرى أو فئة مختلفة.
  </p>
</section>

<footer class="site-footer">
  <div class="container footer-bottom">
    <span>© 2026 متجر اونمي. جميع الحقوق محفوظة.</span>
    <a href="index.html">العودة للرئيسية</a>
  </div>
</footer>

<script src="js/products-data.js"></script>
<script src="js/icons.js"></script>
<script src="js/main.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  let state = {
    cat: params.get("cat") || "all",
    q: (params.get("q") || "").trim(),
    sort: "default"
  };

  const chipsEl = document.getElementById("chips");
  const sortSelect = document.createElement("select");
  sortSelect.innerHTML = `
    <option value="default">ترتيب: الأكثر صلة</option>
    <option value="price-asc">السعر: من الأقل للأعلى</option>
    <option value="price-desc">السعر: من الأعلى للأقل</option>
    <option value="rating">الأعلى تقييمًا</option>
  `;
  sortSelect.addEventListener("change", () => { state.sort = sortSelect.value; render(); });

  ONEMI_CATEGORIES.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "chip" + (c.key === state.cat ? " active" : "");
    btn.textContent = c.name;
    btn.addEventListener("click", () => {
      state.cat = c.key;
      [...chipsEl.querySelectorAll(".chip")].forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    });
    chipsEl.appendChild(btn);
  });
  chipsEl.appendChild(sortSelect);

  function render(){
    let list = ONEMI_PRODUCTS.filter(p => state.cat === "all" || p.category === state.cat);
    if (state.q){
      const q = state.q.toLowerCase();
      list = list.filter(p => p.name.toLowerCase().includes(q) || p.short.toLowerCase().includes(q));
    }
    if (state.sort === "price-asc") list.sort((a,b) => a.price - b.price);
    if (state.sort === "price-desc") list.sort((a,b) => b.price - a.price);
    if (state.sort === "rating") list.sort((a,b) => b.rating - a.rating);

    document.getElementById("page-title").textContent = state.q ? `نتائج البحث عن "${state.q}"` : "كل المنتجات";
    document.getElementById("results-count").textContent = `${list.length} منتج`;
    document.getElementById("grid").innerHTML = list.map(productCardHTML).join("");
    document.getElementById("empty-msg").style.display = list.length ? "none" : "block";
  }
  render();
</script>
</body>
</html>
