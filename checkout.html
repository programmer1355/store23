<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إتمام الطلب | اونمي</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-row">
    <a href="index.html" class="brand"><span class="brand-mark">او</span>اونمي</a>
    <nav class="main-nav">
      <a href="index.html">الرئيسية</a>
      <a href="products.html">المنتجات</a>
      <a href="index.html#about">من نحن</a>
      <a href="index.html#contact">تواصل معنا</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="cart-link">سلة التسوق <span class="cart-count" data-cart-count>0</span></a>
    </div>
  </div>
</header>

<section class="section container">
  <div class="section-head"><div><h2>إتمام الطلب</h2></div></div>
  <div id="checkout-root"></div>
</section>

<footer class="site-footer">
  <div class="container footer-bottom">
    <span>© 2026 متجر اونمي. جميع الحقوق محفوظة.</span>
    <a href="products.html">متابعة التسوق</a>
  </div>
</footer>

<script src="js/products-data.js"></script>
<script src="js/icons.js"></script>
<script src="js/main.js"></script>
<script>
  const root = document.getElementById("checkout-root");
  const lines = cartLines();

  if (!lines.length){
    root.innerHTML = `
      <div class="empty-state">
        <h3>لا يمكن إتمام الطلب</h3>
        <p>سلة التسوق فارغة حاليًا.</p>
        <a href="products.html" class="btn btn-primary">تصفح المنتجات</a>
      </div>`;
  } else {
    const subtotal = cartSubtotal();
    const shipping = subtotal >= 500 ? 0 : 25;
    const total = subtotal + shipping;

    root.innerHTML = `
      <form class="checkout-layout" id="checkout-form" novalidate>
        <div class="form-card">
          <h3>بيانات الشحن</h3>
          <div class="form-grid">
            <div class="field full">
              <label>الاسم الكامل</label>
              <input type="text" name="fullName" required>
            </div>
            <div class="field">
              <label>رقم الجوال</label>
              <input type="tel" name="phone" placeholder="05xxxxxxxx" required>
            </div>
            <div class="field">
              <label>البريد الإلكتروني (اختياري)</label>
              <input type="email" name="email">
            </div>
            <div class="field full">
              <label>المدينة</label>
              <input type="text" name="city" required>
            </div>
            <div class="field full">
              <label>العنوان التفصيلي</label>
              <textarea name="address" rows="3" required></textarea>
            </div>
          </div>

          <h3 style="margin-top:22px;">طريقة الدفع</h3>
          <div class="pay-options">
            <label class="pay-option"><input type="radio" name="payment" value="cod" checked> الدفع عند الاستلام</label>
            <label class="pay-option"><input type="radio" name="payment" value="transfer"> تحويل بنكي</label>
            <label class="pay-option"><input type="radio" name="payment" value="card"> بطاقة ائتمان / مدى</label>
          </div>
          <div class="order-note">
            هذا نموذج عرض توضيحي لمتجر ثابت. لتفعيل دفع إلكتروني حقيقي، اربط هذا النموذج ببوابة دفع
            (مثل مدى أو Stripe أو PayTabs) عبر خادم خلفي — راجع ملف README المرفق لمزيد من التفاصيل.
          </div>
        </div>

        <aside class="summary-card">
          <h3>ملخص الطلب</h3>
          ${lines.map(l => `
            <div class="summary-row"><span>${l.product.name} × ${l.qty}</span><span>${formatPrice(l.product.price * l.qty)}</span></div>
          `).join("")}
          <div class="summary-row"><span>الشحن</span><span>${shipping === 0 ? "مجاني" : formatPrice(shipping)}</span></div>
          <div class="summary-row total"><span>الإجمالي</span><span>${formatPrice(total)}</span></div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:16px;">تأكيد الطلب</button>
        </aside>
      </form>
    `;

    document.getElementById("checkout-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const order = {
        id: "ON" + Date.now().toString().slice(-8),
        date: new Date().toISOString(),
        customer: {
          name: fd.get("fullName"), phone: fd.get("phone"), email: fd.get("email"),
          city: fd.get("city"), address: fd.get("address")
        },
        payment: fd.get("payment"),
        items: lines.map(l => ({ id: l.product.id, name: l.product.name, qty: l.qty, price: l.product.price })),
        subtotal, shipping, total
      };
      const orders = JSON.parse(localStorage.getItem("onemi_orders") || "[]");
      orders.push(order);
      localStorage.setItem("onemi_orders", JSON.stringify(orders));
      localStorage.removeItem(CART_KEY);

      root.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h3>تم استلام طلبك بنجاح</h3>
          <p>رقم الطلب: <strong>${order.id}</strong> — سيتواصل معك فريقنا قريبًا لتأكيد التوصيل.</p>
          <a href="products.html" class="btn btn-primary">متابعة التسوق</a>
        </div>`;
      updateCartBadge();
    });
  }
</script>
</body>
</html>
