<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سلة التسوق | اونمي</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-row">
    <a href="index.html" class="brand"><span class="brand-mark">او</span>اونمي</a>
    <nav class="main-nav">
      <a href="index.html">الرئيسية</a>
      <a href="products.html">المنتجات</a>
      <a href="index.html#about">من نحن</a>
      <a href="index.html#contact">تواصل معنا</a>
    </nav>
    <div class="header-actions">
      <form class="search-box" data-header-search>
        <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="m18 18-3.8-3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input type="text" placeholder="ابحث عن منتج...">
      </form>
      <a href="cart.html" class="cart-link">سلة التسوق <span class="cart-count" data-cart-count>0</span></a>
    </div>
  </div>
</header>

<section class="section container">
  <div class="section-head"><div><h2>سلة التسوق</h2></div></div>
  <div id="cart-root"></div>
</section>

<footer class="site-footer">
  <div class="container footer-bottom">
    <span>© 2026 متجر اونمي. جميع الحقوق محفوظة.</span>
    <a href="products.html">متابعة التسوق</a>
  </div>
</footer>

<script src="js/products-data.js"></script>
<script src="js/icons.js"></script>
<script src="js/main.js"></script>
<script>
  function render(){
    const lines = cartLines();
    const root = document.getElementById("cart-root");

    if (!lines.length){
      root.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3 4h2l2.4 12.4A2 2 0 0 0 9.36 18H18a2 2 0 0 0 1.96-1.6L21.5 8H6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9.5" cy="21" r="1.4" fill="currentColor"/><circle cx="17.5" cy="21" r="1.4" fill="currentColor"/></svg>
          <h3>سلتك فارغة</h3>
          <p>لم تقم بإضافة أي منتج بعد.</p>
          <a href="products.html" class="btn btn-primary">تصفح المنتجات</a>
        </div>`;
      return;
    }

    const subtotal = cartSubtotal();
    const shipping = subtotal >= 500 ? 0 : 25;
    const total = subtotal + shipping;

    root.innerHTML = `
      <div class="cart-layout">
        <div>
          ${lines.map(l => `
            <div class="cart-item">
              <div class="cart-item-thumb">${onemiIcon(l.product.category)}</div>
              <div>
                <a class="cart-item-name" href="product.html?id=${l.product.id}">${l.product.name}</a>
                <div class="cart-item-cat">${l.product.categoryName} · ${formatPrice(l.product.price)}</div>
                <button class="remove-link" data-remove="${l.product.id}">إزالة</button>
              </div>
              <div class="qty-control">
                <button type="button" data-minus="${l.product.id}">−</button>
                <input type="text" value="${l.qty}" data-qty="${l.product.id}" inputmode="numeric">
                <button type="button" data-plus="${l.product.id}">+</button>
              </div>
              <strong>${formatPrice(l.product.price * l.qty)}</strong>
            </div>
          `).join("")}
        </div>
        <aside class="summary-card">
          <h3>ملخص الطلب</h3>
          <div class="summary-row"><span>المجموع الفرعي</span><span>${formatPrice(subtotal)}</span></div>
          <div class="summary-row"><span>الشحن</span><span>${shipping === 0 ? "مجاني" : formatPrice(shipping)}</span></div>
          <div class="summary-row total"><span>الإجمالي</span><span>${formatPrice(total)}</span></div>
          <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:16px;">المتابعة للدفع</a>
          <p style="color:rgba(251,248,242,.6); font-size:.78rem; margin-top:10px;">
            ${shipping === 0 ? "تهانينا، حصلت على شحن مجاني." : "أضف " + formatPrice(500 - subtotal) + " أخرى للحصول على شحن مجاني."}
          </p>
        </aside>
      </div>
    `;

    root.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => { removeFromCart(b.dataset.remove); render(); });
    root.querySelectorAll("[data-minus]").forEach(b => b.onclick = () => {
      const line = getCart().find(l => l.id === b.dataset.minus);
      setQty(b.dataset.minus, (line?.qty || 1) - 1); render();
    });
    root.querySelectorAll("[data-plus]").forEach(b => b.onclick = () => {
      const line = getCart().find(l => l.id === b.dataset.plus);
      setQty(b.dataset.plus, (line?.qty || 1) + 1); render();
    });
    root.querySelectorAll("[data-qty]").forEach(inp => inp.onchange = () => {
      setQty(inp.dataset.qty, parseInt(inp.value) || 1); render();
    });
  }
  render();
</script>
</body>
</html>
